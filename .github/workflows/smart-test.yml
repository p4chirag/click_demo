name: Smart Test Selection

on:
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

jobs:
  smart-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Fetch full history so p4opt can diff PR base..head
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pytest deps
        run: pip install pytest pytest-json-report

      - name: Install P4CIOptimizer
        run: pip install "git+https://github.com/p4chirag/p4ciopt.git@main"

      - name: Install Click from local source (override Typer's click pin)
        # --no-deps so pip doesn't redo Typer's resolution and downgrade click.
        run: pip install --no-deps --force-reinstall -e .

      - name: Resolve base/head SHAs
        id: shas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "from=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "to=${{ github.event.pull_request.head.sha }}"   >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch / push: diff the last commit
            echo "from=HEAD~1" >> "$GITHUB_OUTPUT"
            echo "to=HEAD"      >> "$GITHUB_OUTPUT"
          fi

      - name: Smart Test Selection (with full-suite comparison)
        run: |
          p4opt ci \
            --vcs git \
            --from ${{ steps.shas.outputs.from }} \
            --to   ${{ steps.shas.outputs.to }} \
            --project . \
            --compare \
            --pytest-arg=--override-ini=filterwarnings=
